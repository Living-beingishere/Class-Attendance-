<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بەڕێوەبەری بەشداری بەشەکان</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3 { color: #2c3e50; text-align: center; }
        
        /* Home Grid */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .group-card {
            background: #f9f9f9;
            border: 1px solid #dcdde1;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .group-card h3 { margin: 0 0 10px 0; color: #2980b9; font-size: 18px; }
        .card-btns {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .card-btns button {
            flex: 1;
            padding: 8px;
            font-size: 13px;
        }

        /* Group View */
        .hidden { display: none !important; }
        .back-btn {
            background-color: #7f8c8d;
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .back-btn:hover { background-color: #636e72; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #34495e; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        button:hover { background-color: #219653; }

        .search-box { margin-top: 20px; margin-bottom: 15px; }

        .student-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 400px;
            overflow-y: auto;
        }
        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f9f9f9;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e1e8ed;
        }
        .student-info {
            cursor: pointer;
            flex-grow: 1;
        }
        .student-name {
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
        }
        
        .joined .student-name {
            text-decoration: line-through;
            color: #95a5a6;
        }
        .joined-badge {
            color: #27ae60;
            font-weight: bold;
            font-size: 14px;
            margin-left: 10px;
            background: #e8f8f5;
            padding: 4px 10px;
            border-radius: 4px;
        }
        
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            width: auto;
        }
        .delete-btn:hover { background: #c0392b; }
        
        .stats {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }
        .sync-status {
            text-align: center;
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- HOME VIEW: 7 PARTS -->
    <div id="homeView">
        <h2>بەشەکانی تۆمارکردنی بەشداری</h2>
        <div class="sync-status" id="syncStatus">بارکردنی داتا لە سێرڤەر...</div>
        <p style="text-align: center; color: #7f8c8d; font-size: 14px;">دەتوانیت ناوی هەر بەشێک بگۆڕیت و پاشان دابگریت بۆ چوونە ژوورەوە:</p>
        
        <div class="groups-grid" id="groupsGrid">
            <!-- Dynamically generated 7 parts -->
        </div>
    </div>

    <!-- GROUP DETAIL VIEW -->
    <div id="groupView" class="hidden">
        <button class="back-btn" onclick="goHome()">⬅ گەڕانەوە بۆ پێڕستی بەشەکان</button>
        <h2 id="activeGroupTitle">ناوی بەش</h2>

        <!-- Add Student Form -->
        <div class="form-group">
            <label>ناوی تەواوی قوتابی (سێ ناو یان دوو ناو):</label>
            <input type="text" id="studentNameInput" placeholder="بۆ نموونە: ئارا سیروان یوسف">
        </div>
        <button onclick="addStudentToCurrentGroup()">زیادکردنی قوتابی بۆ ئەم بەشە</button>

        <!-- Scoped Search -->
        <div class="search-box">
            <input type="text" id="groupSearchInput" placeholder="گەڕان تەنها لەم بەشەدا..." onkeyup="renderCurrentGroupStudents()">
        </div>

        <!-- Stats -->
        <div class="stats" id="groupStatsText">کۆی گشتی ئەم بەشە: 0 | بەشداربوو: 0</div>

        <!-- Student List -->
        <ul class="student-list" id="groupStudentList" style="margin-top: 15px;"></ul>
    </div>

</div>

<script>
    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "https://efgueganwiehnnwjsmys.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_TjB3ENNdK2lqYp4VFuPEmQ_0JMaM6_s";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let appData = {
        names: ["بێ ناونیشان", "بێ ناونیشان", "بێ ناونیشان", "بێ ناونیشان", "بێ ناونیشان", "بێ ناونیشان", "بێ ناونیشان"],
        lists: [[], [], [], [], [], [], []]
    };

    let activeGroupIndex = null;

    // Load data from Supabase on startup
    window.onload = async function() {
        await loadDataFromCloud();
    };

    async function loadDataFromCloud() {
        try {
            const { data, error } = await supabaseClient
                .from('group_attendance_config')
                .select('*')
                .eq('id', 1)
                .single();

            if (!error && data && data.content) {
                appData =typeof data.content === 'string' ? JSON.parse(data.content) : data.content;
                document.getElementById('syncStatus').innerText = "✅ داتا لە سێرڤەرەوە بە سەرکەوتوویی بارکرا";
            } else {
                document.getElementById('syncStatus').innerText = "⚠ داتای سەرەتایی بەکاردێت";
            }
        } catch (e) {
            console.log("Error loading cloud data:", e);
            document.getElementById('syncStatus').innerText = "⚠ کێشە لە پەیوەندی سێرڤەر";
        }
        renderHome();
    }

    async function saveDataToCloud() {
        document.getElementById('syncStatus').innerText = "⏳ پاشەکەوتکردن لە سێرڤەر...";
        try {
            const { error } = await supabaseClient
                .from('group_attendance_config')
                .upsert([{ id: 1, content: appData, updated_at: new Date().toISOString() }]);

            if (error) {
                console.error("Save error:", error.message);
                document.getElementById('syncStatus').innerText = "❌ هەلە لە پاشەکەوتکردن";
            } else {
                document.getElementById('syncStatus').innerText = "✅ پاشەکەوت کرا و هاوئاهەنگە";
            }
        } catch (e) {
            console.error("Save exception:", e);
            document.getElementById('syncStatus').innerText = "❌ کێشە لە پەیوەندی";
        }
    }

    function renderHome() {
        const grid = document.getElementById('groupsGrid');
        grid.innerHTML = '';

        appData.names.forEach((name, idx) => {
            let total = appData.lists[idx].length;
            let joined = appData.lists[idx].filter(s => s.joined).length;

            const card = document.createElement('div');
            card.className = 'group-card';
            card.innerHTML = `
                <h3>${name}</h3>
                <p style="margin: 5px 0 10px 0; font-size: 13px; color: #7f8c8d;">قوتابی: ${total} | بەشداربوو: ${joined}</p>
                <div class="card-btns">
                    <button onclick="renameGroup(${idx})" style="background-color: #e67e22;">گۆڕینی ناو</button>
                    <button onclick="openGroup(${idx})" style="background-color: #3498db;">چوونەژوورەوە</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    async function renameGroup(index) {
        let currentName = appData.names[index];
        let newName = prompt("ناوی نوێ بۆ ئەم بەشە بنووسە:", currentName === "بێ ناونیشان" ? "" : currentName);
        if (newName !== null && newName.trim() !== "") {
            appData.names[index] = newName.trim();
            await saveDataToCloud();
            renderHome();
        }
    }

    function openGroup(index) {
        activeGroupIndex = index;
        document.getElementById('homeView').classList.add('hidden');
        document.getElementById('groupView').classList.remove('hidden');
        document.getElementById('activeGroupTitle').innerText = appData.names[index];
        document.getElementById('groupSearchInput').value = '';
        renderCurrentGroupStudents();
    }

    function goHome() {
        activeGroupIndex = null;
        document.getElementById('groupView').classList.add('hidden');
        document.getElementById('homeView').classList.remove('hidden');
        loadDataFromCloud(); // Refresh from cloud when going back home
    }

    async function addStudentToCurrentGroup() {
        const input = document.getElementById('studentNameInput');
        const name = input.value.trim();

        if(!name) {
            alert('تکایە ناوی قوتابی بنووسە!');
            input.focus();
            return;
        }

        appData.lists[activeGroupIndex].push({
            name: name,
            joined: false
        });

        input.value = '';
        await saveDataToCloud();
        renderCurrentGroupStudents();
    }

    async function toggleJoined(studentIndex) {
        appData.lists[activeGroupIndex][studentIndex].joined = !appData.lists[activeGroupIndex][studentIndex].joined;
        await saveDataToCloud();
        renderCurrentGroupStudents();
    }

    async function deleteStudent(studentIndex, event) {
        event.stopPropagation();
        if(confirm('دڵنیایت لە سڕینەوەی ئەم قوتابییە؟')) {
            appData.lists[activeGroupIndex].splice(studentIndex, 1);
            await saveDataToCloud();
            renderCurrentGroupStudents();
        }
    }

    function renderCurrentGroupStudents() {
        const listEl = document.getElementById('groupStudentList');
        const statsEl = document.getElementById('groupStatsText');
        const query = document.getElementById('groupSearchInput').value.toLowerCase();
        
        listEl.innerHTML = '';
        
        let students = appData.lists[activeGroupIndex];
        let joinedCount = students.filter(s => s.joined).length;

        students.forEach((student, idx) => {
            if(student.name.toLowerCase().includes(query)) {
                const li = document.createElement('li');
                li.className = `student-item ${student.joined ? 'joined' : ''}`;
                
                li.innerHTML = `
                    <div class="student-info" onclick="toggleJoined(${idx})">
                        <div class="student-name">${student.name}</div>
                    </div>
                    <div style="display: flex; align-items: center;">
                        ${student.joined ? '<span class="joined-badge">بەشداریکرد</span>' : ''}
                        <button class="delete-btn" onclick="deleteStudent(${idx}, event)">سڕینەوە</button>
                    </div>
                `;
                listEl.appendChild(li);
            }
        });

        statsEl.innerText = `کۆی گشتی ئەم بەشە: ${students.length} | بەشداربوو: ${joinedCount}`;
    }
</script>

</body>
</html>
